[project]
name = "read-habit"
version = "0.1.0"
description = "A command line interface for tracking reading habits."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "dpomian" }]
dependencies = []

[project.scripts]
read-habit = "read_habit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/read_habit"]

[dependency-groups]
dev = ["pytest>=8.0"]
